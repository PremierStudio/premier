name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=low
      - name: Install RustSec audit tool
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Audit Rust dependencies
        run: cargo audit
      - name: Scan tracked files for committed secrets
        run: npm run security:secrets
      - run: npm run test:all
      - run: ./scripts/tests/distribution.sh
      - run: node scripts/tests/preflight-npm-trusted-publishing.test.mjs
