name: Security

# Fail the job on actionable findings. No SARIF upload: this does not depend on
# GitHub Advanced Security. Push to main, pull requests, the nightly advisory
# scan, and workflow_dispatch all run the same checks.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo-deny + cargo-audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      # deny.toml is the policy: licenses, bans, sources, yanked crates, advisories.
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@bb119f768ea239e765aeaef5769558d4f21213aa # v2.1.5
        with:
          command: check
          arguments: --all-features
          manifest-path: ./Cargo.toml
      - name: Install cargo-audit
        uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-audit
      - name: cargo-audit
        run: cargo audit

  pnpm-audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      # Frozen install so the audit reads the committed lockfile and cannot rewrite it.
      - name: Install Studio dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - name: Audit high and critical advisories
        run: pnpm --dir apps/web audit --audit-level high

  trivy:
    name: Trivy (vuln, misconfig, secret)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.2
          cache: true
      - name: Verify Trivy
        run: |
          set -euo pipefail
          command -v trivy
          trivy --version
      # --ignore-unfixed only drops vulnerabilities whose Status is not "fixed".
      # Misconfigurations are untouched. jq applies that filter; trivy convert
      # then fails the job on anything left.
      - name: Report HIGH/CRITICAL vulnerabilities and misconfigurations
        run: |
          set -euo pipefail
          mkdir -p results/security
          trivy fs . \
            --scanners vuln,misconfig \
            --severity HIGH,CRITICAL \
            --format json \
            --output results/security/trivy-all-high-critical.json \
            --exit-code 0
      - name: Block fixable HIGH/CRITICAL vulnerabilities and misconfigurations
        run: |
          set -euo pipefail
          jq 'if .Results then .Results[] |= (if .Vulnerabilities then .Vulnerabilities |= map(select(.Status == "fixed")) else . end) else . end' \
            results/security/trivy-all-high-critical.json \
            > results/security/trivy-blocking.json
          trivy convert \
            --scanners vuln,misconfig \
            --severity HIGH,CRITICAL \
            --format table \
            --exit-code 1 \
            results/security/trivy-blocking.json
      - name: Block committed HIGH/CRITICAL secrets
        run: |
          set -euo pipefail
          trivy fs . \
            --scanners secret \
            --severity HIGH,CRITICAL \
            --format table \
            --exit-code 1
      - name: Retain security evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/security/trivy-*.json
          if-no-files-found: warn
          retention-days: 14

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # advanced-security uploads SARIF and does not fail the job. Offline mode
      # still lints workflow files and returns non-zero when it finds issues.
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          advanced-security: false
          online-audits: false
          version: "1.33.1"
