name: Security

# Fail the job on actionable findings. No SARIF upload: this does not depend on
# GitHub Advanced Security. Push to main, pull requests, the nightly advisory
# scan, and workflow_dispatch all run the same checks.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo-deny + cargo-audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install and verify cargo-deny and cargo-audit
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          curl -fsSL --retry 3 -o "$tmpdir/cargo-deny.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/0.22.2/cargo-deny-0.22.2-x86_64-unknown-linux-musl.tar.gz"
          echo "9f831cfb5d03a5093c0810091a7bd3b5e4724a1288cbe5718d8ce8cef2590adf  $tmpdir/cargo-deny.tar.gz" | sha256sum -c -
          tar -xzf "$tmpdir/cargo-deny.tar.gz" -C "$tmpdir"
          install -m 0755 "$tmpdir/cargo-deny-0.22.2-x86_64-unknown-linux-musl/cargo-deny" "$HOME/.cargo/bin/cargo-deny"

          curl -fsSL --retry 3 -o "$tmpdir/cargo-audit.tgz" \
            "https://github.com/rustsec/rustsec/releases/download/cargo-audit/v0.23.0/cargo-audit-x86_64-unknown-linux-musl-v0.23.0.tgz"
          echo "4f01c74ed84b2dffd0b1d37012a62cdf2a92c96e25bdf8eec7fcc0d4d3eb7811  $tmpdir/cargo-audit.tgz" | sha256sum -c -
          tar -xzf "$tmpdir/cargo-audit.tgz" -C "$tmpdir"
          install -m 0755 "$tmpdir/cargo-audit-x86_64-unknown-linux-musl-v0.23.0/cargo-audit" "$HOME/.cargo/bin/cargo-audit"
      # deny.toml is the policy: licenses, bans, sources, yanked crates, advisories.
      - name: cargo-deny
        run: cargo deny --manifest-path ./Cargo.toml --all-features check
      - name: cargo-audit
        run: cargo audit

  pnpm-audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install pnpm
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          curl -fsSL --retry 3 -o "$tmpdir/pnpm" \
            "https://github.com/pnpm/pnpm/releases/download/v10.33.0/pnpm-linux-x64"
          echo "8d4e8f7d778e8ac482022e2577011706a872542f6f6f233e795a4d9f978ea8b5  $tmpdir/pnpm" | sha256sum -c -
          sudo install -m 0755 "$tmpdir/pnpm" /usr/local/bin/pnpm
      # Frozen install so the audit reads the committed lockfile and cannot rewrite it.
      - name: Install Studio dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - name: Audit high and critical advisories
        run: pnpm --dir apps/web audit --audit-level high

  trivy:
    name: Trivy (vuln, misconfig, secret)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.2
          cache: true
      - name: Verify Trivy
        run: |
          set -euo pipefail
          command -v trivy
          trivy --version
      # --ignore-unfixed only drops vulnerabilities whose Status is not "fixed".
      # Misconfigurations are untouched. jq applies that filter; trivy convert
      # then fails the job on anything left.
      - name: Report HIGH/CRITICAL vulnerabilities and misconfigurations
        run: |
          set -euo pipefail
          mkdir -p results/security
          trivy fs . \
            --scanners vuln,misconfig \
            --severity HIGH,CRITICAL \
            --format json \
            --output results/security/trivy-all-high-critical.json \
            --exit-code 0
      - name: Block fixable HIGH/CRITICAL vulnerabilities and misconfigurations
        run: |
          set -euo pipefail
          jq 'if .Results then .Results[] |= (if .Vulnerabilities then .Vulnerabilities |= map(select(.Status == "fixed")) else . end) else . end' \
            results/security/trivy-all-high-critical.json \
            > results/security/trivy-blocking.json
          trivy convert \
            --scanners vuln,misconfig \
            --severity HIGH,CRITICAL \
            --format table \
            --exit-code 1 \
            results/security/trivy-blocking.json
      - name: Block committed HIGH/CRITICAL secrets
        run: |
          set -euo pipefail
          trivy fs . \
            --scanners secret \
            --severity HIGH,CRITICAL \
            --format table \
            --exit-code 1
      - name: Retain security evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/security/trivy-*.json
          if-no-files-found: warn
          retention-days: 14

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install and run zizmor
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          curl -fsSL --retry 3 -o "$tmpdir/zizmor.tar.gz" \
            "https://github.com/zizmorcore/zizmor/releases/download/v1.33.1/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "3e6a301c7a820a2501915f5a9de8c0486da82bdec7965f068477538a98743d43  $tmpdir/zizmor.tar.gz" | sha256sum -c -
          tar -xzf "$tmpdir/zizmor.tar.gz" -C "$tmpdir"
          chmod +x "$tmpdir/zizmor"
          "$tmpdir/zizmor" --offline .github/workflows
