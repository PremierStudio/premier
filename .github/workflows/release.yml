name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify (fmt, clippy, test, studio)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Install bubblewrap (agent-sandbox tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap git
      - name: Git identity (tests commit into temp repositories)
        run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install pnpm
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          curl -fsSL --retry 3 -o "$tmpdir/pnpm" \
            "https://github.com/pnpm/pnpm/releases/download/v10.33.0/pnpm-linux-x64"
          echo "8d4e8f7d778e8ac482022e2577011706a872542f6f6f233e795a4d9f978ea8b5  $tmpdir/pnpm" | sha256sum -c -
          sudo install -m 0755 "$tmpdir/pnpm" /usr/local/bin/pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: pnpm typecheck
        working-directory: apps/web
      - run: pnpm test:all
        working-directory: apps/web
      - run: pnpm build
        working-directory: apps/web

  studio:
    name: Build Studio UI
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install pnpm
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          curl -fsSL --retry 3 -o "$tmpdir/pnpm" \
            "https://github.com/pnpm/pnpm/releases/download/v10.33.0/pnpm-linux-x64"
          echo "8d4e8f7d778e8ac482022e2577011706a872542f6f6f233e795a4d9f978ea8b5  $tmpdir/pnpm" | sha256sum -c -
          sudo install -m 0755 "$tmpdir/pnpm" /usr/local/bin/pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: pnpm build
        working-directory: apps/web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: studio-dist
          path: apps/web/dist
          if-no-files-found: error

  binaries:
    name: premier ${{ matrix.target }}
    needs: [verify, studio]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # Native ARM. rusqlite's bundled SQLite and ring need a C compiler
          # for the host, which a cross linker on ubuntu-latest does not provide.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          # macos-14 was removed on 2026-11-02. macos-15 is Apple Silicon and
          # its SDK links both darwin targets.
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15
            target: x86_64-apple-darwin
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          case "$TARGET" in
            x86_64-unknown-linux-gnu|aarch64-unknown-linux-gnu|x86_64-pc-windows-msvc|aarch64-apple-darwin|x86_64-apple-darwin) ;;
            *) echo "unexpected target: $TARGET" >&2; exit 1 ;;
          esac
          rustup toolchain install stable --profile minimal --target "$TARGET"
          rustup default stable
      - name: Build
        shell: bash
        run: cargo build --release --locked -p premier-cli --target "$TARGET"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: studio-dist
          path: stage/ui
      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            *[!A-Za-z0-9._-]*) echo "refusing tag name" >&2; exit 1 ;;
          esac
          name="premier-${GITHUB_REF_NAME}-${TARGET}"
          mkdir -p "$name"
          cp "target/${TARGET}/release/premier" LICENSE-APACHE LICENSE-MIT README.md "$name/"
          chmod 755 "$name/premier"
          cp -r stage/ui "$name/ui"
          if [ "$RUNNER_OS" = "Linux" ]; then
            cp deploy/premier.service "$name/"
          fi
          tar -czf "$name.tar.gz" "$name"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" | awk '{print $1 "  " $2}' > "$name.tar.gz.sha256"
          fi
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^[A-Za-z0-9._-]+$') { throw 'refusing tag name' }
          $name = "premier-$env:GITHUB_REF_NAME-$env:TARGET"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item "target/$env:TARGET/release/premier.exe", LICENSE-APACHE, LICENSE-MIT, README.md $name
          Copy-Item -Recurse stage/ui "$name/ui"
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"
          "ASSET=$name.zip" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: premier-${{ matrix.target }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          if-no-files-found: error

  github-release:
    name: GitHub Release
    needs: [verify, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: premier-*
          path: dist
          merge-multiple: true
      - name: Combined checksums
        run: cd dist && sha256sum premier-* | grep -v '\.sha256$' > SHA256SUMS
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$TAG" in
            *[!A-Za-z0-9._-]*) echo "refusing tag name" >&2; exit 1 ;;
          esac
          gh release create "$TAG" dist/* --generate-notes --verify-tag

  docker-build:
    name: Docker (${{ matrix.platform }})
    needs: [verify, studio, binaries]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            slug: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            slug: linux-arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/premierstudio/premier
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/premierstudio/premier,push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          digest="${DIGEST#sha256:}"
          case "$digest" in
            ""|*[!0-9a-f]*)
              echo "Unexpected digest: $DIGEST" >&2
              exit 1
              ;;
          esac
          touch "/tmp/digests/${digest}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker:
    name: Docker image (ghcr.io)
    needs: [docker-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/premierstudio/premier
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          tag_args=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              tag_args+=("-t" "$tag")
            fi
          done <<< "$TAGS"
          digest_args=()
          for d in *; do
            case "$d" in
              ""|*[!0-9a-f]*)
                echo "Unexpected digest artifact: $d" >&2
                exit 1
                ;;
              *)
                digest_args+=("ghcr.io/premierstudio/premier@sha256:${d}")
                ;;
            esac
          done
          if [ "${#tag_args[@]}" -eq 0 ] || [ "${#digest_args[@]}" -ne 2 ]; then
            echo "Missing tags (${#tag_args[@]}) or digests (${#digest_args[@]})" >&2
            exit 1
          fi
          docker buildx imagetools create "${tag_args[@]}" "${digest_args[@]}"
      - name: Inspect image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          first_tag="$(printf '%s\n' "$TAGS" | head -n1)"
          docker buildx imagetools inspect "$first_tag"
