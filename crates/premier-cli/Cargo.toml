[package]
name = "premier-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Premier agent reporter CLI — record, emit, verify, and view local-first agent traces"
readme = "../../README.md"
keywords = ["agent", "trace", "observability", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "premier"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-stream.workspace = true
axum.workspace = true
axum-server.workspace = true
base64.workspace = true
chrono.workspace = true
clap.workspace = true
futures-core.workspace = true
mime_guess = "2.0.5"
premier-trace = { path = "../premier-trace" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust-embed = { version = "8.12.0", features = ["interpolate-folder-path"] }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
proptest = "1"
tempfile.workspace = true
tower.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
portable-pty = "0.9"
signal-hook = "0.3"
