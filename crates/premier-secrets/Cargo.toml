[package]
name = "premier-secrets"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Premier secret vault: .env.schema, envelope KMS and age encryption, OIDC workload tokens, rotation and output redaction"
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["secrets", "vault", "kms", "oidc", "age"]
categories = ["cryptography", "authentication", "development-tools"]

[dependencies]
aes-gcm.workspace = true
age.workspace = true
aho-corasick.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
ed25519-dalek = { version = "3", features = ["zeroize"] }
hex.workspace = true
hmac.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
rand.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
premier-core.workspace = true
premier-policy.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
toml.workspace = true
tracing.workspace = true
url.workspace = true
webpki-roots.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native"] }

[dev-dependencies]
rcgen.workspace = true
tempfile.workspace = true

[lints]
workspace = true
