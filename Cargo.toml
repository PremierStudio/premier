[workspace]
resolver = "3"
members = [
    "crates/premier-core",
    "crates/premier-policy",
    "crates/premier-secrets",
    "crates/premier-overlay",
    "crates/premier-proxy",
    "crates/premier-git-bridge",
    "crates/premier-ssh",
    "crates/premier-trace",
    "crates/premier-server",
    "crates/premier-cli",
    "crates/premier",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/PremierStudio/premier"
homepage = "https://github.com/PremierStudio/premier"
rust-version = "1.89"

[workspace.dependencies]
premier-core = { version = "0.1.0", path = "crates/premier-core" }
premier-policy = { version = "0.1.0", path = "crates/premier-policy" }
premier-secrets = { version = "0.1.0", path = "crates/premier-secrets" }
premier-overlay = { version = "0.1.0", path = "crates/premier-overlay" }
premier-proxy = { version = "0.1.0", path = "crates/premier-proxy" }
premier-git-bridge = { version = "0.1.0", path = "crates/premier-git-bridge" }
premier-ssh = { version = "0.1.0", path = "crates/premier-ssh" }
premier-trace = { version = "0.1.0", path = "crates/premier-trace" }
premier-server = { version = "0.1.0", path = "crates/premier-server" }

aes-gcm = "0.10"
age = "0.11"
aho-corasick = "1"
anyhow = "1"
argon2 = "0.5"
axum = "0.8"
base64 = "0.22"
bitflags = { version = "2", features = ["serde"] }
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
globset = "0.4"
hex = "0.4"
hmac = "0.12"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
libc = "0.2"
proptest = "1"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand = "0.8"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2"
tar = { version = "0.4", default-features = false }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "1.2"
toml_edit = "0.22"
tower-http = { version = "0.6", features = ["cors", "fs"] }
tower-service = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
webpki-roots = "0.26"
zeroize = { version = "1", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
strip = true
